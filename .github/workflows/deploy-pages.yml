name: Deploy to GitHub Pages

on:
  push:
    # This repository's default branch is `master`, not `main`. Listening for `main` here
    # meant the deploy never fired once — a silent failure, since a workflow that never
    # runs reports no error.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Without this the action only *checks* whether Pages is enabled, and fails when it
          # is not. That is exactly what happened on the first real push: the build job passed
          # and then died here with "Get Pages site failed ... HttpError: Not Found", because
          # a repository that has never deployed has no Pages site to configure. The workflow
          # was correct; the repository was simply unconfigured, and nothing said so.
          #
          # Turning it on makes the deploy self-sufficient rather than dependent on a settings
          # page someone has to remember. It is idempotent — on a repository that already has
          # Pages enabled it does nothing.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
