name: Deploy to GitHub Pages

on:
  push:
    # This repository's default branch is `master`, not `main`. Listening for `main` here
    # meant the deploy never fired once — a silent failure, since a workflow that never
    # runs reports no error.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages must be switched on once by hand: Settings -> Pages -> Source: "GitHub Actions".
      # This step only *reads* that setting; nothing in this workflow can create it.
      #
      # `enablement: true` looks like the fix and is not. Creating a Pages site calls
      # POST /repos/{owner}/{repo}/pages, which requires the "Administration" (write)
      # permission. The `permissions:` key exposes 16 scopes and `administration` is not
      # among them, so GITHUB_TOKEN can never satisfy it. Run #2 died here with
      # "Resource not accessible by integration". Re-adding `enablement: true` will not
      # help — the setting above is the only way through.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
